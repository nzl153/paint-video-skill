<!doctype html>
<meta charset="utf-8">
<title>render audio</title>
<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
<script src="score.js"></script>
<script>
// 离线渲染（不经过声卡），拼成 16-bit WAV，分块交给 Node。
window.renderAudio = async (seconds) => {
  const buf = await Tone.Offline(async ({ transport }) => {
    await buildScore((d, t) => console.log(`loaded ${d}/${t}`));
    transport.start(0);
  }, seconds, 2, 44100);
  const L = buf.getChannelData(0), Rt = buf.getChannelData(1), len = L.length, sr = buf.sampleRate;
  const out = new ArrayBuffer(44 + len * 4), v = new DataView(out);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + len * 4, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true); v.setUint32(24, sr, true);
  v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, len * 4, true);
  let peak = 0;
  for (let i = 0, o = 44; i < len; i++, o += 4) {
    peak = Math.max(peak, Math.abs(L[i]), Math.abs(Rt[i]));
    v.setInt16(o, Math.max(-1, Math.min(1, L[i])) * 32767, true);
    v.setInt16(o + 2, Math.max(-1, Math.min(1, Rt[i])) * 32767, true);
  }
  window.wavBytes = new Uint8Array(out);
  return { bytes: out.byteLength, seconds: len / sr, sampleRate: sr, peak };
};
window.wavChunk = (i, size) => {
  const part = window.wavBytes.subarray(i, i + size);
  let s = ''; for (let k = 0; k < part.length; k++) s += String.fromCharCode(part[k]);
  return btoa(s);
};
</script>
