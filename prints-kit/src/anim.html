<!doctype html>
<meta charset="utf-8">
<title>远光 动画</title>
<style>html,body{margin:0;background:#f7f2e6;overflow:hidden}#stage svg{display:block;width:100vw;height:100vh}</style>
<div id="stage"></div>
<script src="plates.js"></script>
<script>
(() => {
const { W, H, LX, LY, P, INK, sm, D1, D2, F1, F2, F3, F4, F5, F6 } = YG;
const mix = (a, b, k) => Object.fromEntries(Object.keys(a).map(n => [n, a[n] + (b[n] - a[n]) * k]));
const n1 = v => Math.round(v * 1000) / 1000;
// 16:9 画布，版画居中，左右露纸边
const VW = H * 16 / 9, VX = (W - VW) / 2;

// 镜头：一路缓缓推向远光，风起高点推得最近一次，高处略退（原来没那么高），尾声拉回全景
const KEYS = [[0, 1], [24, 1.04], [40, 1.07], [56, 1.13], [64, 1.08], [80, 1.12], [92, 1.2], [100, 1.12], [116, 1]];
const zoom = b => { for (let i = 1; i < KEYS.length; i++) if (b <= KEYS[i][0]) { const [a, za] = KEYS[i - 1], [c, zc] = KEYS[i]; return za + (zc - za) * sm(a, c, b); } return 1; };

// 换场遮罩：每一种都是下一段工艺自己的「印法」
const full = `x="${VX - 40}" y="-40" width="${VW + 80}" height="${H + 80}"`;
const M = {
  // 揭纸：从左下往右上揭开，揭口一道淡影
  pull(p) {
    const e = .06, a = p * (1 + e) - e, g = id => `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="-40" y1="${H + 40}" x2="${W + 40}" y2="-40">`;
    return { defs: g('tg') + `<stop offset="${n1(a)}" stop-color="#fff"/><stop offset="${n1(a + e)}" stop-color="#000"/></linearGradient><mask id="tm" maskUnits="userSpaceOnUse" ${full}><rect ${full} fill="url(#tg)"/></mask>`
      + g('ts') + `<stop offset="${n1(a - .02)}" stop-color="${INK}" stop-opacity="0"/><stop offset="${n1(a + e * .6)}" stop-color="${INK}" stop-opacity=".16"/><stop offset="${n1(a + e + .005)}" stop-color="${INK}" stop-opacity="0"/></linearGradient>`,
      shade: `<rect ${full} fill="url(#ts)"/>` };
  },
  // 流纹冲开：一道波浪形的边从左往右推过去
  flow(p) {
    const pts = [];
    for (let y = -40; y <= H + 40; y += 8) pts.push(`${n1(-80 + p * (W + 220) + 45 * Math.sin(y * .022 + p * 5) + 18 * Math.sin(y * .071 - p * 3))},${y}`);
    return { defs: `<filter id="tb"><feGaussianBlur stdDeviation="6"/></filter><mask id="tm" maskUnits="userSpaceOnUse" ${full}><path d="M${VX - 40},-40 L${pts.join(' L')} L${VX - 40},${H + 40}Z" fill="#fff" filter="url(#tb)"/></mask>`, shade: '' };
  },
  // 显影：蓝晒从远光那一点向外晒开
  develop(p) {
    const a = p * 1.08 - .07;
    return { defs: `<radialGradient id="tg" gradientUnits="userSpaceOnUse" cx="${LX}" cy="${LY}" r="860"><stop offset="${n1(Math.max(0, a))}" stop-color="#fff"/><stop offset="${n1(Math.max(0, a) + .07)}" stop-color="#000"/></radialGradient><mask id="tm" maskUnits="userSpaceOnUse" ${full}><rect ${full} fill="url(#tg)"/></mask>`, shade: '' };
  },
  // 压网点：网点从光源往外一颗颗长大，连成整版
  dots(p) {
    let c = '';
    for (let x = VX - 30; x < VX + VW + 30; x += 13) for (let y = -10; y < H + 13; y += 13) {
      const rr = 10 * Math.max(0, Math.min(1, (p * 1.5 - Math.hypot(x - LX, y - LY) / 800) / .45));
      if (rr > .2) c += `<circle cx="${n1(x)}" cy="${y}" r="${n1(rr)}"/>`;
    }
    return { defs: `<mask id="tm" maskUnits="userSpaceOnUse" ${full}><g fill="#fff">${c}</g></mask>`, shade: '' };
  },
  // 走墨：像压印滚筒从上往下滚过
  scan(p) {
    const e = .08, a = p * (1 + e) - e, g = id => `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="-20" x2="0" y2="${H + 20}">`;
    return { defs: g('tg') + `<stop offset="${n1(a)}" stop-color="#fff"/><stop offset="${n1(a + e)}" stop-color="#000"/></linearGradient><mask id="tm" maskUnits="userSpaceOnUse" ${full}><rect ${full} fill="url(#tg)"/></mask>`
      + g('ts') + `<stop offset="${n1(a - .02)}" stop-color="${INK}" stop-opacity="0"/><stop offset="${n1(a + e * .6)}" stop-color="${INK}" stop-opacity=".12"/><stop offset="${n1(a + e + .005)}" stop-color="${INK}" stop-opacity="0"/></linearGradient>`,
      shade: `<rect ${full} fill="url(#ts)"/>` };
  }
};

// 六段：起始拍、换进来的窗口、印法
const SECT = [[F1], [F2, 23, 25, 'pull'], [F3, 39.5, 41, 'flow'], [F4, 63, 65.5, 'develop'], [F5, 79, 81, 'dots'], [F6, 95, 97.5, 'scan']];
const plate = (k, b) => k === 1 ? F2({ t: b, d: mix(D1, D2, sm(25, 29, b)) }) : SECT[k][0]({ t: b });
const END = 120.4;

// 一天：盛夏是傍晚，往后一路入夜，远光最深，尾声天亮。用正片叠底压在版画上，远光那一圈留出来
const SKY = [[0, 217, 160, 102, 0], [6, 217, 160, 102, .14], [20, 205, 140, 95, .2], [32, 90, 96, 120, .26], [40, 60, 70, 98, .32], [56, 50, 60, 90, .38],
  [64, 40, 55, 90, .22], [78, 40, 55, 90, .26], [84, 35, 42, 70, .42], [94, 35, 42, 70, .42], [100, 225, 190, 150, .14], [110, 240, 215, 180, .06], [116, 240, 215, 180, 0]];
const sky = b => {
  let i = 1; while (i < SKY.length - 1 && b > SKY[i][0]) i++;
  const A = SKY[i - 1], B = SKY[i], k = sm(A[0], B[0], b), v = j => A[j] + (B[j] - A[j]) * k;
  return { c: `rgb(${Math.round(v(1))},${Math.round(v(2))},${Math.round(v(3))})`, op: v(4), hole: 70 + 80 * sm(80, 86, b) * (1 - sm(96, 100, b)) };
};
// 版画边角的铅笔题签
const TITLE = ['盛夏', '仰望', '风起', '高处', '远光', '尾声'];
const label = (k, b) => {
  const s0 = k ? SECT[k][2] : 4, s1 = k < 5 ? SECT[k + 1][1] : 124, op = .7 * sm(s0, s0 + 1.5, b) * (1 - sm(s1 - 1.5, s1, b));
  return op <= 0 ? '' : `<text x="${n1(VX + 22)}" y="${H - 14}" fill="#5f5a52" opacity="${n1(op)}" font-size="11.5" letter-spacing="1.5"><tspan font-family="Georgia,serif" font-style="italic">${k + 1}/6</tspan><tspan dx="7" font-family="KaiTi,STKaiti,serif">${TITLE[k]}</tspan></text>`;
};

window.draw = b => {
  let k = 0;
  for (let i = 1; i < SECT.length; i++) if (b >= SECT[i][1]) k = i;
  let defs, body, glow;
  const cur = plate(k, b);
  if (k > 0 && b < SECT[k][2]) {
    const prev = plate(k - 1, b), m = M[SECT[k][3]](sm(SECT[k][1], SECT[k][2], b));
    defs = prev.defs + cur.defs + m.defs;
    body = prev.body + `<g mask="url(#tm)">${cur.body}</g>` + m.shade;
    glow = prev.glow + `<g mask="url(#tm)">${cur.glow}</g>`;
  } else ({ defs, body, glow } = cur);
  const z = zoom(b), fade = sm(END - 1.3, END, b), sk = sky(b);
  const night = sk.op > .003 ? `<radialGradient id="nh" gradientUnits="userSpaceOnUse" cx="${LX}" cy="${LY}" r="${n1(sk.hole)}"><stop offset=".25" stop-color="#000"/><stop offset="1" stop-color="#fff"/></radialGradient>`
    + `<mask id="nm" maskUnits="userSpaceOnUse" x="${VX - 60}" y="-60" width="${VW + 120}" height="${H + 120}"><rect x="${VX - 60}" y="-60" width="${VW + 120}" height="${H + 120}" fill="#fff"/><circle cx="${LX}" cy="${LY}" r="${n1(sk.hole)}" fill="url(#nh)"/></mask>` : '';
  document.getElementById('stage').innerHTML = `<svg viewBox="${VX} 0 ${VW} ${H}" xmlns="http://www.w3.org/2000/svg"><defs>${defs}${night}</defs><rect x="${VX}" width="${VW}" height="${H}" fill="${P}"/>`
    + `<g transform="translate(${LX} ${LY}) scale(${n1(z)}) translate(${-LX} ${-LY})">${body}`
    + (night ? `<rect x="${VX - 60}" y="-60" width="${VW + 120}" height="${H + 120}" fill="${sk.c}" opacity="${n1(sk.op)}" mask="url(#nm)" style="mix-blend-mode:multiply"/>` : '')
    + `${glow}</g>` + label(k, b)
    + (fade > 0 ? `<rect x="${VX}" width="${VW}" height="${H}" fill="${P}" opacity="${n1(fade)}"/>` : '') + `</svg>`;
};
draw(0);
})();
</script>
